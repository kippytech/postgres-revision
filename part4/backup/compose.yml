services:
  postgres:
    image: postgres:16
    container_name: postgres-backup-lab
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: backup_lab
    ports:
      - "5435:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./archive:/var/lib/postgresql/wal_archive
      - ./base_backup:/var/lib/postgresql/base_backup

  recovery:
    image: postgres:16
    container_name: postgres-recovery-lab
    profiles:
      - recovery
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: backup_lab
    ports:
      - "5436:5432"
    volumes:
      - ./base_backup:/var/lib/postgresql/data
      - ./archive:/var/lib/postgresql/wal_archive

volumes:
  postgres_data:



